<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano (Wicki-Hayden)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
  </head>
  <body>
    <div id="drop-zone">
      <div class="drop-text">DROP MIDI FILE HERE</div>
    </div>
    
    <div id="quick-controls">
      <!-- Playback group -->
      <div class="control-group hidden-in-sustain" id="group-playback">
        <div class="btn-row">
          <button class="control-btn quick-btn" id="btn-play" onclick="togglePlayback()" data-tooltip="Play">
            <img src="icon/play.png" class="btn-icon" alt="Play">
          </button>
          <button class="control-btn quick-btn" id="btn-pause" onclick="pausePlayback()" data-tooltip="Pause" disabled>
            <img src="icon/pause.png" class="btn-icon" alt="Pause">
          </button>
          <button class="control-btn quick-btn" id="btn-clear" onclick="resetHighlights()" data-tooltip="Clear Keys">
            <img src="icon/clear.png" class="btn-icon" alt="Clear">
          </button>
        </div>
      </div>

      <div class="control-divider hidden-in-sustain"></div>

      <!-- MIDI File group -->
      <div class="control-group playback-controls hidden-in-sustain" id="group-memory">
        <input type="file" id="midi-upload" accept=".mid,.midi" style="display: none;" onchange="handleMidiUpload(event)">
        <button class="control-btn quick-btn" id="btn-load" onclick="document.getElementById('midi-upload').click()" data-tooltip="Load MIDI File">
          <img src="icon/load.png" class="btn-icon" alt="Load">
        </button>
      </div>

      <div class="control-divider hidden-in-sustain"></div>

      <!-- Labels group -->
      <div class="control-group hidden-in-sustain" id="group-labels">
        <button class="control-btn quick-btn" onclick="cycleLabels()" id="btn-labels" data-tooltip="Labels: NOTES">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
        </button>
      </div>

      <div class="control-divider hidden-in-sustain"></div>

      <!-- Transpose group -->
      <div class="control-group hidden-in-sustain" id="group-transpose">
        <div class="btn-row">
          <button class="control-btn quick-btn" onclick="changeTranspose(-1)" data-tooltip="Transpose -1">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="quick-val-box" id="disp-trans-box" data-tooltip="Transpose: -2">
            <input type="number" class="control-val-input" id="disp-trans" value="-2" onchange="setDirectValue('trans', this.value)">
          </div>
          <button class="control-btn quick-btn" onclick="changeTranspose(1)" data-tooltip="Transpose +1">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Top Right Corner Settings Button -->
    <button class="control-btn quick-btn hidden-in-sustain" id="btn-settings" onclick="toggleSettings()" data-tooltip="Settings">
      <img src="icon/setting.png" class="btn-icon" alt="Settings">
    </button>

    <!-- Sustain / Pedal Button (Bottom Right Above Piano Strip) -->
    <button class="control-btn quick-btn" id="btn-pedal" onclick="toggleSustainMode()" data-tooltip="Sustain: ON">
      <img src="icon/sustain.png" class="btn-icon" alt="Sustain">
      <span id="pedal-light" class="pedal-light-dot"></span>
    </button>

    <div id="settings-panel">
      <!-- Tab Bar -->
      <div id="settings-tab-bar">
        <button class="settings-tab active" data-tab="keyboard" onclick="switchSettingsTab('keyboard')">Keyboard</button>
        <button class="settings-tab" data-tab="playback" onclick="switchSettingsTab('playback')">Playback</button>
        <button class="settings-tab" data-tab="visuals" onclick="switchSettingsTab('visuals')">Visuals</button>
        <button class="settings-tab" data-tab="reverb" onclick="switchSettingsTab('reverb')">Reverb</button>
        <button class="settings-tab" data-tab="strip" onclick="switchSettingsTab('strip')">Strip</button>
        <button class="settings-tab" data-tab="midi" onclick="switchSettingsTab('midi')">MIDI</button>
      </div>

      <!-- Tab: Keyboard -->
      <div class="settings-tab-content active" id="tab-keyboard">
        <div class="control-group">
          <span class="control-label">Transpose</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changeTranspose(-1)">-</button>
            <input type="number" class="control-val-input" id="disp-trans-set" value="-2" onchange="setDirectValue('trans', this.value)">
            <button class="control-btn" onclick="changeTranspose(1)">+</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">F-Keys</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleFKeys()" id="btn-fkeys">1-1</button>
        </div>

        <div class="control-group">
          <span class="control-label">Board</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleBoard()" id="btn-board">HIDE</button>
        </div>
      </div>

      <!-- Tab: Playback -->
      <div class="settings-tab-content" id="tab-playback">
        <div class="control-group">
          <span class="control-label">Song Transpose</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changePlaybackTranspose(-1)">-</button>
            <input type="number" class="control-val-input" id="disp-play-trans" value="0" onchange="setDirectValue('play-trans', this.value)">
            <button class="control-btn" onclick="changePlaybackTranspose(1)">+</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Speed</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changePlaybackSpeed(-0.1)">-</button>
            <input type="number" step="0.1" class="control-val-input" id="disp-speed" value="1.0" onchange="setDirectValue('speed', this.value)">
            <button class="control-btn" onclick="changePlaybackSpeed(0.1)">+</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Note Fall</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changeFallDuration(-0.5)">-</button>
            <input type="number" step="0.5" class="control-val-input" id="disp-fall" value="5.0" onchange="setDirectValue('fall', this.value)">
            <button class="control-btn" onclick="changeFallDuration(0.5)">+</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Manual Speed</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changeManualRiseSpeed(-10)">-</button>
            <input type="number" step="10" class="control-val-input" id="disp-manual-speed" value="200" onchange="setDirectValue('manual-speed', this.value)">
            <button class="control-btn" onclick="changeManualRiseSpeed(10)">+</button>
          </div>
        </div>
      </div>

      <!-- Tab: Visuals -->
      <div class="settings-tab-content" id="tab-visuals">
        <div class="control-group">
          <span class="control-label">Visualizer</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleVisuals()" id="btn-visuals">ON</button>
        </div>

        <div class="control-group">
          <span class="control-label">Quick Panel</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleQuickSettings()" id="btn-quick-settings">HIDE</button>
        </div>

        <div class="control-group">
          <span class="control-label">Screen</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleFullScreen()" id="btn-fullscreen">FULL</button>
        </div>
      </div>

      <!-- Tab: Reverb -->
      <div class="settings-tab-content" id="tab-reverb">
        <div class="control-group">
          <span class="control-label">Reverb</span>
          <button class="control-btn" style="width: 96px; height: 34px; font-size: 12px;" onclick="toggleReverb()" id="btn-reverb">ON</button>
        </div>
        <div class="control-group">
          <span class="control-label">Wet Mix</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changeReverb(-0.05)">-</button>
            <input type="number" class="control-val-input" id="disp-reverb" value="50" onchange="setDirectValue('reverb', this.value)">
            <button class="control-btn" onclick="changeReverb(0.05)">+</button>
          </div>
        </div>
      </div>

      <!-- Tab: Piano Strip -->
      <div class="settings-tab-content" id="tab-strip">
        <div class="control-group">
          <span class="control-label">Range</span>
          <div style="display: flex; gap: 10px;">
            <div style="display:flex; flex-direction:column; align-items:center;">
              <span class="side-label">LEFT</span>
              <div class="btn-row">
                <button class="control-btn" onclick="changeStripRange('left', -1)">-</button>
                <input type="number" class="control-val-input" id="disp-strip-l" value="-24" onchange="setDirectValue('strip-l', this.value)">
                <button class="control-btn" onclick="changeStripRange('left', 1)">+</button>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
              <span class="side-label">RIGHT</span>
              <div class="btn-row">
                <button class="control-btn" onclick="changeStripRange('right', -1)">-</button>
                <input type="number" class="control-val-input" id="disp-strip-r" value="59" onchange="setDirectValue('strip-r', this.value)">
                <button class="control-btn" onclick="changeStripRange('right', 1)">+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Height</span>
          <div class="btn-row">
            <button class="control-btn" onclick="changeStripHeight(-1)">-</button>
            <input type="number" class="control-val-input" id="disp-strip-height" value="18" onchange="setDirectValue('strip-height', this.value)">
            <button class="control-btn" onclick="changeStripHeight(1)">+</button>
          </div>
        </div>
      </div>

      <!-- Tab: MIDI -->
      <div class="settings-tab-content" id="tab-midi">
        <div class="control-group">
          <span class="control-label">Status</span>
          <span id="disp-midi-status" style="font-size: 11px; font-weight: bold; color: #00d2ff; letter-spacing: 0.5px;">Not Connected</span>
        </div>

        <div class="control-group">
          <span class="control-label">Device</span>
          <select id="midi-device-select" class="control-select" onchange="setMidiDevice(this.value)">
            <option value="all">All Devices</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">Channel</span>
          <select id="midi-channel-select" class="control-select" onchange="setMidiChannel(this.value)">
            <option value="all">All Channels</option>
            <option value="1">Channel 1</option>
            <option value="2">Channel 2</option>
            <option value="3">Channel 3</option>
            <option value="4">Channel 4</option>
            <option value="5">Channel 5</option>
            <option value="6">Channel 6</option>
            <option value="7">Channel 7</option>
            <option value="8">Channel 8</option>
            <option value="9">Channel 9</option>
            <option value="10">Channel 10</option>
            <option value="11">Channel 11</option>
            <option value="12">Channel 12</option>
            <option value="13">Channel 13</option>
            <option value="14">Channel 14</option>
            <option value="15">Channel 15</option>
            <option value="16">Channel 16</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">Connection</span>
          <button class="control-btn" style="width: 140px; height: 34px; font-size: 11px;" onclick="connectMidiDevices()" id="btn-midi-connect">CONNECT / RESCAN</button>
        </div>
      </div>

    </div>

    <canvas id="synthesia-canvas"></canvas>

    <div id="board-wrapper">
      <div class="wicki-board" id="board"></div>
    </div>

    <div id="piano-strip"></div>

    <div id="progress-container">
      <input type="range" id="progress-bar" min="0" max="100" value="0" step="any" oninput="scrubProgress(this.value)">
    </div>
    
    <!-- ===== FILE ORGANIZATION =====
         js/core/   state.js        - Constants, state, audio engine, settings
         js/playback/scheduler.js   - Playback engine, visualizer, scheduling
         js/ui/     board.js        - Wicki board & piano strip rendering, DOM caching
         js/input/  controls.js     - Mouse/touch/keyboard events, control functions, UI updates
         js/input/  midi.js         - Web MIDI API, MIDI file loading
    ================================ -->
    <script src="js/state.js"></script>
    <script src="js/scheduler.js"></script>
    <script src="js/board.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/midi.js"></script>
  </body>
</html>
